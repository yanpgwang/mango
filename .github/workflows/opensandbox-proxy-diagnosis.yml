name: OpenSandbox proxy diagnosis

on:
  push:
    branches: [codex/opensandbox-upstream-diagnosis]

permissions:
  contents: read

jobs:
  service-core:
    name: ${{ matrix.mode }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        mode: [stock, host-mapped]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Start dependencies
        run: docker compose -f deployments/local/compose.yaml up -d --wait postgres temporal nats minio opensandbox
      - name: Force host-mapped sandbox proxy targets
        if: matrix.mode == 'host-mapped'
        run: |
          docker exec mango-opensandbox sh -ec 'grep -Fq "resolve_internal=True" /app/opensandbox_server/api/proxy.py && sed -i "s|resolve_internal=True|resolve_internal=False|g" /app/opensandbox_server/api/proxy.py'
          docker restart mango-opensandbox
          for attempt in $(seq 1 60); do
            if curl -fsS --max-time 2 http://127.0.0.1:8090/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - name: Run reproducer
        env:
          OPEN_SANDBOX_API_KEY: sk-opensandbox-local-development
        run: |
          response=$(curl -fsS --max-time 30 \
            -H "OPEN-SANDBOX-API-KEY: $OPEN_SANDBOX_API_KEY" \
            -H 'Content-Type: application/json' \
            -d '{"image":{"uri":"python:3.12-slim"},"timeout":60,"resourceLimits":{},"entrypoint":["tail","-f","/dev/null"]}' \
            http://127.0.0.1:8090/v1/sandboxes)
          sandbox_id=$(jq -r .id <<<"$response")
          trap 'curl -fsS --max-time 15 -o /dev/null -X DELETE -H "OPEN-SANDBOX-API-KEY: $OPEN_SANDBOX_API_KEY" "http://127.0.0.1:8090/v1/sandboxes/$sandbox_id" || true' EXIT
          curl -fsS --max-time 10 \
            -H "OPEN-SANDBOX-API-KEY: $OPEN_SANDBOX_API_KEY" \
            "http://127.0.0.1:8090/v1/sandboxes/$sandbox_id/proxy/44772/ping"
      - name: Show OpenSandbox and Docker state
        if: always()
        run: |
          docker compose -f deployments/local/compose.yaml logs --no-color opensandbox
          docker ps --all --no-trunc
      - name: Stop dependencies
        if: always()
        run: docker compose -f deployments/local/compose.yaml down --volumes
