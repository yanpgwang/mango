name: Integration

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  service-core:
    name: Core services
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Start PostgreSQL, Temporal, NATS, MinIO, and OpenSandbox
        run: docker compose -f deployments/local/compose.yaml up -d --wait postgres temporal nats minio opensandbox
      - name: Run core service integration tests
        run: make test-service-core
      - name: Show dependency logs after failure
        if: failure()
        run: docker compose -f deployments/local/compose.yaml logs --no-color postgres temporal nats minio opensandbox
      - name: Stop service dependencies
        if: always()
        run: docker compose -f deployments/local/compose.yaml down --volumes

  opensandbox-sandboxes:
    name: OpenSandbox on Docker
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Run OpenSandbox sandbox conformance tests
        run: make test-sandbox-opensandbox
      - name: Show OpenSandbox and Docker state after failure
        if: failure()
        run: |
          docker compose -f deployments/local/compose.yaml logs --no-color opensandbox
          docker ps --all --no-trunc
      - name: Stop OpenSandbox
        if: always()
        run: docker compose -f deployments/local/compose.yaml down --volumes

  required:
    name: Required
    if: always()
    needs: [service-core, opensandbox-sandboxes]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every integration layer
        env:
          CORE_RESULT: ${{ needs.service-core.result }}
          SANDBOX_RESULT: ${{ needs.opensandbox-sandboxes.result }}
        run: |
          if [ "$CORE_RESULT" != "success" ] || [ "$SANDBOX_RESULT" != "success" ]; then
            echo "Core services: $CORE_RESULT"
            echo "OpenSandbox sandboxes: $SANDBOX_RESULT"
            exit 1
          fi
