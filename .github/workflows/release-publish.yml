name: Publish developer preview

on:
  workflow_dispatch:
    inputs:
      candidate_run:
        description: Successful main-branch Release candidate run ID
        required: true
        type: string
      version:
        description: Exact accepted alpha version
        required: true
        type: string
      revision:
        description: Full accepted source commit
        required: true
        type: string
      publish:
        description: Publish the validated bytes to public registries and GitHub
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: mango-publication
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CANDIDATE_RUN: ${{ inputs.candidate_run }}
      CANDIDATE_VERSION: ${{ inputs.version }}
      CANDIDATE_REVISION: ${{ inputs.revision }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s scripts/release -p 'test_*.py'
      - name: Validate source CI and download exact accepted candidate
        run: >-
          python scripts/release/promote.py prepare
          --run "$CANDIDATE_RUN" --version "$CANDIDATE_VERSION"
          --revision "$CANDIDATE_REVISION" --folder dist/candidate
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: validated-promotion-input
          path: dist/candidate/
          if-no-files-found: error
          retention-days: 1

  publish:
    if: inputs.publish
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: release
    permissions:
      contents: write
      actions: read
      packages: write
      id-token: write
    env:
      CANDIDATE_RUN: ${{ inputs.candidate_run }}
      CANDIDATE_VERSION: ${{ inputs.version }}
      CANDIDATE_REVISION: ${{ inputs.revision }}
      GH_TOKEN: ${{ github.token }}
      NPM_CONFIG_PROVENANCE: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: validated-promotion-input
          path: dist/candidate
      - name: Revalidate and stage only missing SDK distributions
        id: stage
        run: >-
          python scripts/release/promote.py stage
          --run "$CANDIDATE_RUN" --version "$CANDIDATE_VERSION"
          --revision "$CANDIDATE_REVISION" --folder dist/candidate
      - name: Install OCI-aware transfer tooling
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y skopeo
      - name: Authenticate the ephemeral image publisher
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_AUTH_FILE: ${{ runner.temp }}/mango-registry-auth.json
        run: printf '%s' "$GH_TOKEN" | skopeo login --authfile "$REGISTRY_AUTH_FILE" --username "$REGISTRY_USER" --password-stdin ghcr.io
      - name: Preserve and anonymously verify both multi-platform indexes
        env:
          REGISTRY_AUTH_FILE: ${{ runner.temp }}/mango-registry-auth.json
        run: >-
          python scripts/release/promote.py images
          --run "$CANDIDATE_RUN" --version "$CANDIDATE_VERSION"
          --revision "$CANDIDATE_REVISION" --folder dist/candidate
      - name: Publish the unchanged npm tarball using Trusted Publishing
        if: steps.stage.outputs.npm_missing == 'true'
        run: |
          node -e 'const v=process.versions.node.split(".").map(Number);if(v[0]<22||(v[0]===22&&v[1]<14))process.exit(1)'
          node -e 'const cp=require("node:child_process");const v=cp.execFileSync("npm",["--version"],{encoding:"utf8"}).trim().split(".").map(Number);if(v[0]<11||(v[0]===11&&(v[1]<5||(v[1]===5&&v[2]<1))))process.exit(1)'
          npm publish "dist/candidate/mango-sdk-$CANDIDATE_VERSION.tgz" --tag alpha --access public --ignore-scripts --provenance=false
      - name: Publish unchanged Python archives using Trusted Publishing
        if: steps.stage.outputs.python_missing == 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/pypi-upload
      - name: Verify public SDKs and publish the matching GitHub prerelease
        run: >-
          python scripts/release/promote.py finish
          --run "$CANDIDATE_RUN" --version "$CANDIDATE_VERSION"
          --revision "$CANDIDATE_REVISION" --folder dist/candidate
      - name: Remove ephemeral registry credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/mango-registry-auth.json"
