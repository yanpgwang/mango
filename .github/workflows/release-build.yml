name: Release candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: Alpha version matching the checked-out SDK metadata
        required: true
        default: 0.1.0-alpha.2
        type: string

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  candidate:
    name: Build candidate archives and OCI images
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      CANDIDATE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: python -m pip install uv==0.12.5
      - uses: ./.github/actions/setup-helm
        id: helm
      - run: make release-unit
      - name: Build from clean tracked source and validate the input version
        run: python scripts/release/build.py --version "$CANDIDATE_VERSION" --output dist/release/candidate --helm '${{ steps.helm.outputs.path }}'
      - name: Inspect archives and fresh SDK installations
        run: python scripts/release/smoke.py dist/release/candidate --helm '${{ steps.helm.outputs.path }}'
      - name: Read validated candidate identity
        id: identity
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          candidate = json.loads(Path('dist/release/candidate/manifest.json').read_text())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('version=' + candidate['version'] + '\n')
              output.write('revision=' + candidate['revision'] + '\n')
          PY
      - name: Snapshot tracked source for both OCI builds
        id: source
        run: |
          python - <<'PY'
          import json, os, sys, tempfile
          from pathlib import Path
          sys.path.insert(0, 'scripts/release')
          from build import snapshot_source
          candidate = json.loads(Path('dist/release/candidate/manifest.json').read_text())
          source = Path(tempfile.mkdtemp(prefix='mango-oci-', dir=os.environ['RUNNER_TEMP'])) / 'source'
          snapshot_source(Path.cwd(), source, candidate['revision'])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('path=' + str(source) + '\n')
          PY
      - uses: docker/setup-docker-action@v5
        with:
          version: v28.1.1
          set-host: true
          daemon-config: '{"features":{"containerd-snapshotter":true}}'
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Export the control-plane OCI image
        uses: docker/build-push-action@v7
        with:
          context: ${{ steps.source.outputs.path }}
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: |
            VERSION=${{ steps.identity.outputs.version }}
            REVISION=${{ steps.identity.outputs.revision }}
          outputs: type=oci,dest=dist/release/candidate/mango-oci.tar
      - name: Export the operator-run reference worker OCI image
        uses: docker/build-push-action@v7
        with:
          context: ${{ steps.source.outputs.path }}
          file: ${{ steps.source.outputs.path }}/deployments/workers/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: |
            VERSION=${{ steps.identity.outputs.version }}
            REVISION=${{ steps.identity.outputs.revision }}
          outputs: type=oci,dest=dist/release/candidate/mango-self-hosted-worker-oci.tar
      - name: Verify image platforms and identity; complete the checksum index
        run: python scripts/release/images.py dist/release/candidate
      - uses: ./.github/actions/setup-kubernetes
        id: kubernetes
      - name: Install actual artifacts and exercise restart and quiesced restore
        env:
          MANGO_RELEASE_CANDIDATE: dist/release/candidate
        run: >-
          make test-kubernetes
          KIND='${{ steps.kubernetes.outputs.kind }}'
          KUBECTL='${{ steps.kubernetes.outputs.kubectl }}'
          HELM='${{ steps.helm.outputs.path }}'
          SERVICE_TEST_EXEC='sudo -n -E --'
      - uses: actions/upload-artifact@v7
        with:
          name: mango-candidate-${{ steps.identity.outputs.version }}-${{ steps.identity.outputs.revision }}
          path: dist/release/candidate/
          if-no-files-found: error
          retention-days: 14
