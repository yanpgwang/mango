apiVersion: v1
kind: Service
metadata:
  name: {{ include "mango.resourceName" (dict "root" . "suffix" "api") }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "mango.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "mango.selector" (dict "root" . "role" "api") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
