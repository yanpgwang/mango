    WebhookID:
      name: webhook_id
      in: path
      required: true
      schema:
        type: string
        pattern: '^wh_'
    WebhookListLimit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    VaultID:
      name: vault_id
      in: path
      required: true
      schema:
        type: string
        pattern: '^vlt_'
    VaultCredentialID:
      name: credential_id
      in: path
      required: true
      schema:
        type: string
        pattern: '^vcrd_'
    DeploymentID:
      name: deployment_id
      in: path
      required: true
      schema:
        type: string
        pattern: '^depl_'
    DeploymentRunID:
      name: deployment_run_id
      in: path
      required: true
      schema:
        type: string
        pattern: '^drun_'
    DeploymentListLimit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    DeploymentRunListLimit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 20
    DeploymentStatusFilter:
      name: status
      in: query
      schema:
        type: string
        enum: [active, paused]
    DeploymentRunHasError:
      name: has_error
      in: query
      schema: {type: boolean}
    DeploymentRunTriggerType:
      name: trigger_type
      in: query
      schema:
        type: string
        enum: [schedule, manual]
    VaultListLimit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    AgentID:
      name: agent_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    EnvironmentID:
      name: environment_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    EnvironmentWorkID:
      name: work_id
      in: path
      required: true
      schema:
        type: string
        pattern: '^work_'
    EnvironmentWorkListLimit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 100
    EnvironmentWorkBlockMs:
      name: block_ms
      in: query
      description: Long-poll duration. Omit for a non-blocking poll.
      schema:
        type: integer
        minimum: 1
        maximum: 999
    EnvironmentWorkReclaimMs:
      name: reclaim_older_than_ms
      in: query
      description: Reclaim a polled but unacknowledged item after this duration; defaults to 5000.
      schema:
        type: integer
        minimum: 0
    EnvironmentWorkerID:
      name: worker_id
      in: query
      required: false
      description: Operational correlation identifier; it does not authenticate the worker.
      schema: {type: string, minLength: 1}
    EnvironmentWorkExpectedHeartbeat:
      name: expected_last_heartbeat
      in: query
      description: Exact previous heartbeat timestamp, or NO_HEARTBEAT for the first lease heartbeat.
      schema: {type: string, minLength: 1}
    EnvironmentWorkDesiredTTL:
      name: desired_ttl_seconds
      in: query
      description: Desired lease TTL in seconds. Healthy workers renew continuously; Mango caps the stale-owner window at five minutes.
      schema: {type: integer, minimum: 1, maximum: 300}
    SessionID:
      name: session_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    SessionThreadID:
      name: thread_id
      in: path
      required: true
      schema:
        type: string
        pattern: '^sthr_'
    FileID:
      name: file_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    SkillID:
      name: skill_id
      in: path
      required: true
      schema:
        type: string
        pattern: '^skill_'
    SkillVersion:
      name: version
      in: path
      required: true
      schema:
        type: string
        pattern: '^[0-9]+$'
    MemoryStoreID:
      name: store_id
      in: path
      required: true
      schema:
        type: string
        pattern: '^memstore_'
    MemoryID:
      name: memory_id
      in: path
      required: true
      schema:
        type: string
        pattern: '^mem_'
    MemoryVersionID:
      name: version_id
      in: path
      required: true
      schema:
        type: string
        pattern: '^memver_'
    AgentListLimit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    EnvironmentListLimit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 100
    SessionListLimit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 100
    EventListLimit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 100
    SessionThreadListLimit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 1000
    FileListLimit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 20
    SkillListLimit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    SkillVersionListLimit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 20
    MemoryStoreListLimit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    MemoryListLimit:
      name: limit
      in: query
      description: Full views allow at most 20 items; basic views allow at most 100.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    MemoryVersionListLimit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    MemoryView:
      name: view
      in: query
      description: Full includes content; basic returns content as null.
      schema:
        type: string
        enum: [basic, full]
    MemoryPathPrefix:
      name: path_prefix
      in: query
      schema:
        type: string
        maxLength: 1024
    MemoryDepth:
      name: depth
      in: query
      description: Zero lists matching Memories recursively; one projects immediate path prefixes.
      schema:
        type: integer
        enum: [0, 1]
        default: 0
    ExpectedContentSHA256:
      name: expected_content_sha256
      in: query
      schema:
        type: string
        pattern: '^[0-9a-f]{64}$'
    MemoryAPIKeyIDFilter:
      name: api_key_id
      in: query
      schema:
        type: string
    MemorySessionIDFilter:
      name: session_id
      in: query
      schema:
        type: string
    MemoryIDFilter:
      name: memory_id
      in: query
      schema:
        type: string
        pattern: '^mem_'
    MemoryOperationFilter:
      name: operation
      in: query
      schema:
        type: string
        enum: [created, modified, deleted]
    SkillSource:
      name: source
      in: query
      schema:
        type: string
        enum: [custom, anthropic]
    AfterID:
      name: after_id
      in: query
      description: Return the page immediately after this File ID.
      schema:
        type: string
        minLength: 1
    BeforeID:
      name: before_id
      in: query
      description: Return the page immediately before this File ID.
      schema:
        type: string
        minLength: 1
    ScopeID:
      name: scope_id
      in: query
      description: Filter Files by their producing Session ID.
      schema:
        type: string
        minLength: 1
    EventOrder:
      name: order
      in: query
      schema:
        type: string
        enum: [asc, desc]
        default: asc
    EventTypes:
      name: types[]
      in: query
      style: form
      explode: true
      schema:
        type: array
        items:
          $ref: '#/components/schemas/CoreSessionEventType'
    EventDeltas:
      name: event_deltas[]
      in: query
      description: Opt in to best-effort preview frames for the selected event types.
      style: form
      explode: true
      schema:
        type: array
        maxItems: 100
        items:
          type: string
          enum: [agent.message, agent.thinking]
    Page:
      name: page
      in: query
      description: Opaque cursor returned by a previous list response.
      schema:
        type: string
        minLength: 1
    IncludeArchived:
      name: include_archived
      in: query
      schema:
        type: boolean
        default: false
    Order:
      name: order
      in: query
      schema:
        type: string
        enum: [asc, desc]
        default: desc
    AgentIDFilter:
      name: agent_id
      in: query
      schema:
        type: string
    AgentVersionFilter:
      name: agent_version
      in: query
      description: Requires agent_id.
      schema:
        type: integer
        minimum: 1
    Statuses:
      name: statuses[]
      in: query
      style: form
      explode: true
      schema:
        type: array
        items:
          $ref: '#/components/schemas/SessionStatus'
    DeploymentIDFilter:
      name: deployment_id
