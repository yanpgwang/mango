      type: object
      additionalProperties: false
      required: [id, type]
      properties:
        id: {type: string}
        type:
          type: string
          enum: [agent.message, agent.thinking]
    EventStart:
      type: object
      description: Ephemeral preview frame; never persisted in Session event history.
      additionalProperties: false
      required: [type, event]
      properties:
        type: {type: string, const: event_start}
        event: {$ref: '#/components/schemas/EventStartPreview'}
