      type: object
      description: Ephemeral best-effort preview frame; the persisted event is authoritative.
      additionalProperties: false
      required: [type, event_id, delta]
      properties:
        type: {type: string, const: event_delta}
        event_id: {type: string}
        delta: {$ref: '#/components/schemas/EventDeltaContent'}
