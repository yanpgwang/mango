          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Vault'
    VaultListResponse:
      description: Vault page
      headers:
        request-id:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/VaultList'
    VaultDeletedResponse:
      description: Vault deletion confirmation
      headers:
        request-id:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/VaultDeleted'
    WebhookResponse:
      description: Webhook endpoint without its write-only signing secret
      headers:
        request-id: {$ref: '#/components/headers/RequestID'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Webhook'}
    WebhookSecretResponse:
      description: Webhook endpoint with a newly generated write-only signing secret
      headers:
        request-id: {$ref: '#/components/headers/RequestID'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/WebhookWithSigningSecret'}
    WebhookListResponse:
      description: Webhook endpoint page
      headers:
        request-id: {$ref: '#/components/headers/RequestID'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/WebhookList'}
    WebhookDeletedResponse:
      description: Webhook endpoint deletion confirmation
      headers:
        request-id: {$ref: '#/components/headers/RequestID'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/WebhookDeleted'}
    VaultCredentialResponse:
      description: Credential resource with all sensitive fields omitted
      headers:
        request-id:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/VaultCredential'
    VaultCredentialListResponse:
      description: Vault Credential page
      headers:
        request-id:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/VaultCredentialList'
    VaultCredentialDeletedResponse:
      description: Vault Credential deletion confirmation
      headers:
        request-id:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/VaultCredentialDeleted'
    VaultCredentialValidationResponse:
      description: Live MCP OAuth validation result
      headers:
        request-id:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/VaultCredentialValidation'
    InvalidRequest:
      description: Invalid request
      headers:
        request-id:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      headers:
        request-id:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: State or optimistic-concurrency conflict
      headers:
        request-id:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PreconditionFailed:
      description: Work lease ownership or heartbeat precondition failed
      headers:
        request-id:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Authenticated credential is not authorized for the operation
      headers:
        request-id:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnsupportedRequest:
      description: Well-formed capability that this implementation cannot enforce
      headers:
        request-id:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RequestTooLarge:
      description: Request exceeds the endpoint size limit
      headers:
        request-id:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    AuthenticationError:
      description: Missing or invalid bearer credential
      headers:
        request-id:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  headers:
    RequestID:
      description: Identifier for this API request.
      schema:
        type: string

  schemas:
    DeploymentAgentInput:
      oneOf:
        - type: string
          minLength: 1
        - $ref: '#/components/schemas/AgentReference'
    DeploymentInitialEvent:
      oneOf:
        - $ref: '#/components/schemas/UserMessageEventInput'
        - $ref: '#/components/schemas/UserDefineOutcomeEventInput'
        - $ref: '#/components/schemas/SystemMessageEventInput'
      discriminator:
        propertyName: type
    DeploymentScheduleInput:
      type: object
      additionalProperties: false
      required: [type, expression, timezone]
      properties:
        type: {type: string, const: cron}
        expression:
          type: string
          description: Five-field POSIX cron expression.
        timezone:
          type: string
          description: IANA timezone identifier.
    DeploymentSchedule:
      allOf:
        - $ref: '#/components/schemas/DeploymentScheduleInput'
        - type: object
          required: [last_run_at, upcoming_runs_at]
          properties:
            last_run_at: {$ref: '#/components/schemas/NullableTimestamp'}
            upcoming_runs_at:
              type: array
              maxItems: 5
              items: {type: string, format: date-time}
    DeploymentResourceInput:
      oneOf:
        - $ref: '#/components/schemas/FileSessionResourceInput'
        - $ref: '#/components/schemas/MemoryStoreSessionResourceInput'
        - $ref: '#/components/schemas/GitRepositorySessionResourceInput'
      discriminator:
        propertyName: type
      description: Resource templates copied into each Run's Session. Git branch and default checkouts are resolved separately for every Run.
    DeploymentMetadata:
      type: object
      maxProperties: 16
      propertyNames:
        maxLength: 64
      additionalProperties:
        type: string
        maxLength: 512
    DeploymentCreateRequest:
      type: object
      additionalProperties: false
      required: [agent, environment_id, initial_events, name]
      properties:
        agent: {$ref: '#/components/schemas/DeploymentAgentInput'}
        environment_id: {type: string, minLength: 1}
        initial_events:
          type: array
          minItems: 1
          maxItems: 50
          items: {$ref: '#/components/schemas/DeploymentInitialEvent'}
        name: {type: string, minLength: 1}
        description: {type: [string, 'null']}
        metadata: {$ref: '#/components/schemas/DeploymentMetadata'}
        resources:
          type: array
          maxItems: 500
          items: {$ref: '#/components/schemas/DeploymentResourceInput'}
        schedule:
          oneOf:
            - $ref: '#/components/schemas/DeploymentScheduleInput'
            - type: 'null'
        vault_ids:
          type: array
          maxItems: 50
          uniqueItems: true
          items: {type: string, pattern: '^vlt_'}
        budget:
          $ref: '#/components/schemas/NullableSessionBudget'
          description: Session-wide public-list-cost ceiling copied into every Run's Session.
    DeploymentUpdateRequest:
      type: object
      additionalProperties: false
      properties:
        agent:
          $ref: '#/components/schemas/DeploymentAgentInput'
        environment_id: {type: string, minLength: 1}
        initial_events:
          type: array
          minItems: 1
          maxItems: 50
          items: {$ref: '#/components/schemas/DeploymentInitialEvent'}
        name: {type: string, minLength: 1}
        description: {type: [string, 'null']}
        metadata:
          oneOf:
            - type: object
              maxProperties: 16
              additionalProperties: {type: [string, 'null'], maxLength: 512}
            - type: 'null'
        resources:
          oneOf:
            - type: array
              maxItems: 500
              items: {$ref: '#/components/schemas/DeploymentResourceInput'}
            - type: 'null'
        schedule:
          oneOf:
            - $ref: '#/components/schemas/DeploymentScheduleInput'
            - type: 'null'
        vault_ids:
          oneOf:
            - type: array
              maxItems: 50
              uniqueItems: true
              items: {type: string, pattern: '^vlt_'}
            - type: 'null'
        budget:
          $ref: '#/components/schemas/NullableSessionBudget'
          description: Replaces or clears the Session budget template for future Runs.
    DeploymentPausedReason:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type: {type: string, enum: [manual, error]}
        error:
          type: object
          additionalProperties: false
          required: [type]
          properties:
            type: {type: string}
    DeploymentResource:
      oneOf:
        - type: object
          additionalProperties: false
          required: [type, file_id, mount_path]
          properties:
            type: {type: string, const: file}
            file_id: {type: string}
            mount_path: {type: [string, 'null']}
        - type: object
          additionalProperties: false
          required: [type, memory_store_id, access, instructions]
          properties:
            type: {type: string, const: memory_store}
            memory_store_id: {type: string, pattern: '^memstore_'}
            access: {type: [string, 'null'], enum: [read_write, read_only, null]}
            instructions: {type: [string, 'null']}
        - $ref: '#/components/schemas/GitRepositoryDeploymentResource'
      discriminator:
        propertyName: type
    GitRepositoryDeploymentResource:
      type: object
      additionalProperties: false
      required: [type, url, checkout, mount_path]
      properties:
        type:
          type: string
          const: git_repository
        url:
          type: string
          format: uri
          description: Anonymous public HTTPS Git remote retained as a Deployment template.
        checkout:
          oneOf:
            - $ref: '#/components/schemas/GitRepositoryCheckout'
            - type: 'null'
          description: Requested branch or commit, or null to resolve the remote default branch on each Run.
        mount_path:
          type: [string, 'null']
          description: Requested path, or null to derive /workspace/<repository> independently for each Run.
    Deployment:
      type: object
      additionalProperties: false
      required: [id, type, agent, archived_at, budget, created_at, description, environment_id, initial_events, metadata, name, paused_reason, resources, schedule, status, updated_at, vault_ids]
      properties:
        id: {type: string, pattern: '^depl_'}
        type: {type: string, const: deployment}
        agent: {$ref: '#/components/schemas/AgentReference'}
        archived_at: {$ref: '#/components/schemas/NullableTimestamp'}
        budget: {$ref: '#/components/schemas/NullableSessionBudget'}
        created_at: {type: string, format: date-time}
        description: {type: string}
        environment_id: {type: string}
        initial_events:
          type: array
          items: {$ref: '#/components/schemas/DeploymentInitialEvent'}
        metadata: {$ref: '#/components/schemas/DeploymentMetadata'}
        name: {type: string}
        paused_reason:
          oneOf:
            - $ref: '#/components/schemas/DeploymentPausedReason'
            - type: 'null'
        resources:
          type: array
          items: {$ref: '#/components/schemas/DeploymentResource'}
        schedule:
          oneOf:
            - $ref: '#/components/schemas/DeploymentSchedule'
            - type: 'null'
        status: {type: string, enum: [active, paused]}
        updated_at: {type: string, format: date-time}
        vault_ids:
          type: array
          items: {type: string, pattern: '^vlt_'}
    DeploymentList:
      type: object
      additionalProperties: false
      required: [data, next_page]
      properties:
        data:
          type: array
          items: {$ref: '#/components/schemas/Deployment'}
        next_page: {$ref: '#/components/schemas/Cursor'}
    DeploymentRunError:
      type: object
      additionalProperties: false
      required: [type, message]
      properties:
        type:
          type: string
          enum: [environment_archived_error, agent_archived_error, environment_not_found_error, vault_not_found_error, vault_archived_error, file_not_found_error, memory_store_archived_error, skill_not_found_error, session_resource_not_found_error, workspace_archived_error, organization_disabled_error, session_rate_limited_error, session_creation_rejected_error, unknown_error, self_hosted_resources_unsupported_error, mcp_egress_blocked_error]
        message: {type: string}
    DeploymentRunTriggerContext:
      oneOf:
        - type: object
          additionalProperties: false
          required: [type]
          properties:
            type: {type: string, const: manual}
        - type: object
          additionalProperties: false
          required: [type, scheduled_at]
          properties:
            type: {type: string, const: schedule}
            scheduled_at: {type: string, format: date-time}
      discriminator:
        propertyName: type
    DeploymentRun:
      type: object
      additionalProperties: false
      required: [id, type, agent, created_at, deployment_id, error, session_id, trigger_context]
      properties:
        id: {type: string, pattern: '^drun_'}
        type: {type: string, const: deployment_run}
        agent: {$ref: '#/components/schemas/AgentReference'}
        created_at: {type: string, format: date-time}
        deployment_id: {type: string, pattern: '^depl_'}
        error:
          oneOf:
            - $ref: '#/components/schemas/DeploymentRunError'
            - type: 'null'
        session_id: {type: [string, 'null'], pattern: '^sesn_'}
        trigger_context: {$ref: '#/components/schemas/DeploymentRunTriggerContext'}
    DeploymentRunList:
      type: object
      additionalProperties: false
      required: [data, next_page]
      properties:
        data:
          type: array
          items: {$ref: '#/components/schemas/DeploymentRun'}
        next_page: {$ref: '#/components/schemas/Cursor'}
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [type, error, request_id]
      properties:
        type:
          type: string
          const: error
        error:
          type: object
          additionalProperties: false
          required: [type, message]
          properties:
            type:
              type: string
              enum:
                - invalid_request_error
                - authentication_error
                - permission_error
                - not_found_error
                - conflict_error
                - precondition_failed_error
                - memory_precondition_failed_error
                - request_too_large
                - api_error
            message:
              type: string
        request_id:
          type: string

    MemoryMetadata:
      type: object
      additionalProperties:
        type: string
    MemoryMetadataPatch:
      type: object
      additionalProperties:
        type: [string, 'null']
    MemoryStoreCreateRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          maxLength: 1024
        metadata:
          $ref: '#/components/schemas/MemoryMetadata'
    MemoryStoreUpdateRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          maxLength: 1024
        metadata:
          $ref: '#/components/schemas/MemoryMetadataPatch'
    MemoryStore:
      type: object
      additionalProperties: false
      required: [id, type, name, description, metadata, created_at, updated_at, archived_at]
      properties:
        id:
          type: string
          pattern: '^memstore_'
        type:
          type: string
          const: memory_store
        name:
          type: string
        description:
          type: string
        metadata:
          $ref: '#/components/schemas/MemoryMetadata'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        archived_at:
          $ref: '#/components/schemas/NullableTimestamp'
    MemoryStoreList:
      type: object
      additionalProperties: false
      required: [data, has_more, next_page]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/MemoryStore'
        has_more:
          type: boolean
        next_page:
          $ref: '#/components/schemas/Cursor'
    MemoryStoreDeleted:
      type: object
      additionalProperties: false
      required: [id, type]
      properties:
        id:
          type: string
          pattern: '^memstore_'
        type:
          type: string
          const: memory_store_deleted
    MemoryCreateRequest:
      type: object
      additionalProperties: false
      required: [path, content]
      properties:
        path:
          $ref: '#/components/schemas/MemoryPath'
        content:
          type: string
          description: UTF-8 content limited to 102400 encoded bytes.
    MemoryPrecondition:
      type: object
      additionalProperties: false
      required: [type, content_sha256]
      properties:
        type:
          type: string
          const: content_sha256
        content_sha256:
          $ref: '#/components/schemas/MemoryContentSHA256'
    MemoryUpdateRequest:
      type: object
      additionalProperties: false
      properties:
        path:
          $ref: '#/components/schemas/MemoryPath'
        content:
          type: string
          description: UTF-8 content limited to 102400 encoded bytes.
        precondition:
          $ref: '#/components/schemas/MemoryPrecondition'
    MemoryPath:
      type: string
      minLength: 1
      maxLength: 1024
      description: Normalized relative POSIX path; each segment excludes dot and dot-dot.
    MemoryContentSHA256:
      type: string
      pattern: '^[0-9a-f]{64}$'
    Memory:
      type: object
      additionalProperties: false
      required:
        - id
        - type
        - memory_store_id
        - memory_version_id
        - path
        - content
        - content_size_bytes
        - content_sha256
        - created_at
        - updated_at
      properties:
        id:
          type: string
          pattern: '^mem_'
        type:
          type: string
          const: memory
        memory_store_id:
          type: string
          pattern: '^memstore_'
        memory_version_id:
          type: string
          pattern: '^memver_'
        path:
          $ref: '#/components/schemas/MemoryPath'
        content:
          type: [string, 'null']
          description: Null in a basic view.
        content_size_bytes:
          type: integer
          format: int64
          minimum: 0
          maximum: 102400
        content_sha256:
          $ref: '#/components/schemas/MemoryContentSHA256'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    MemoryPrefix:
      type: object
      additionalProperties: false
      required: [type, path]
      properties:
        type:
          type: string
          const: memory_prefix
        path:
          type: string
          minLength: 1
          maxLength: 1024
          pattern: '/$'
    MemoryListItem:
      oneOf:
        - $ref: '#/components/schemas/Memory'
        - $ref: '#/components/schemas/MemoryPrefix'
      discriminator:
        propertyName: type
    MemoryList:
      type: object
      additionalProperties: false
      required: [data, has_more, next_page]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/MemoryListItem'
        has_more:
          type: boolean
        next_page:
          $ref: '#/components/schemas/Cursor'
    MemoryDeleted:
      type: object
      additionalProperties: false
      required: [id, type]
      properties:
        id:
          type: string
          pattern: '^mem_'
        type:
          type: string
          const: memory_deleted
    MemoryAPIActor:
      type: object
      additionalProperties: false
      required: [type, api_key_id]
      properties:
        type:
          type: string
          const: api_actor
        api_key_id:
          type: string
    MemorySessionActor:
      type: object
      additionalProperties: false
      required: [type, session_id]
      properties:
        type:
          type: string
          const: session_actor
        session_id:
          type: string
          pattern: '^sesn_'
    MemoryUserActor:
      type: object
      additionalProperties: false
      required: [type, user_id]
      properties:
        type:
          type: string
          const: user_actor
        user_id:
          type: string
    MemoryActor:
      oneOf:
        - $ref: '#/components/schemas/MemoryAPIActor'
        - $ref: '#/components/schemas/MemorySessionActor'
        - $ref: '#/components/schemas/MemoryUserActor'
      discriminator:
        propertyName: type
    MemoryVersion:
      type: object
      additionalProperties: false
      required:
        - id
        - type
        - memory_store_id
        - memory_id
        - operation
        - path
        - content
        - content_size_bytes
        - content_sha256
        - created_at
        - created_by
        - redacted_at
        - redacted_by
      properties:
        id:
          type: string
          pattern: '^memver_'
        type:
          type: string
          const: memory_version
        memory_store_id:
          type: string
          pattern: '^memstore_'
        memory_id:
          type: string
          pattern: '^mem_'
        operation:
          type: string
          enum: [created, modified, deleted]
        path:
          oneOf:
            - $ref: '#/components/schemas/MemoryPath'
            - type: 'null'
        content:
          type: [string, 'null']
          description: Null for basic views, deleted Versions, and redacted Versions.
        content_size_bytes:
          type: [integer, 'null']
          format: int64
          minimum: 0
          maximum: 102400
        content_sha256:
          oneOf:
            - $ref: '#/components/schemas/MemoryContentSHA256'
            - type: 'null'
        created_at:
          type: string
          format: date-time
        created_by:
          $ref: '#/components/schemas/MemoryActor'
        redacted_at:
          $ref: '#/components/schemas/NullableTimestamp'
        redacted_by:
          oneOf:
            - $ref: '#/components/schemas/MemoryActor'
            - type: 'null'
    MemoryVersionList:
      type: object
      additionalProperties: false
      required: [data, has_more, next_page]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/MemoryVersion'
        has_more:
          type: boolean
        next_page:
          $ref: '#/components/schemas/Cursor'

    FileUploadRequest:
      type: object
      additionalProperties: false
      required: [file]
      properties:
        file:
          type: string
          format: binary
    FileScope:
      type: object
      additionalProperties: false
      required: [id, type]
      properties:
        id:
          type: string
          minLength: 1
        type:
          type: string
          const: session
    File:
      type: object
      additionalProperties: false
      required:
        - id
        - created_at
        - filename
        - mime_type
        - size_bytes
        - type
        - downloadable
        - scope
      properties:
        id:
          type: string
          minLength: 1
        created_at:
          type: string
          format: date-time
        filename:
          type: string
          minLength: 1
          maxLength: 255
        mime_type:
          type: string
          minLength: 1
        size_bytes:
          type: integer
          format: int64
          minimum: 0
          maximum: 524288000
        type:
          type: string
          const: file
        downloadable:
          type: boolean
        scope:
          oneOf:
            - $ref: '#/components/schemas/FileScope'
            - type: 'null'
    FileList:
      type: object
      additionalProperties: false
      required: [data, has_more, first_id, last_id]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/File'
        has_more:
          type: boolean
        first_id:
          type: [string, 'null']
        last_id:
          type: [string, 'null']
    FileDeleted:
      type: object
      additionalProperties: false
      required: [id, type]
      properties:
        id:
          type: string
          minLength: 1
        type:
          type: string
          const: file_deleted

    SkillUploadRequest:
      type: object
      additionalProperties: false
      required: [files]
      properties:
        files:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            type: string
            format: binary
        display_title:
          type: string
          minLength: 1
          maxLength: 255
    SkillVersionUploadRequest:
      type: object
      additionalProperties: false
      required: [files]
      properties:
        files:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            type: string
            format: binary
    SkillResource:
      type: object
      additionalProperties: false
      required: [id, created_at, display_title, latest_version, source, type, updated_at]
      properties:
        id:
          type: string
          pattern: '^skill_'
        created_at:
          type: string
          format: date-time
        display_title:
          type: string
        latest_version:
          type: [string, 'null']
        source:
          type: string
          const: custom
        type:
          type: string
          const: skill
        updated_at:
          type: string
          format: date-time
    SkillList:
      type: object
      additionalProperties: false
      required: [data, has_more, next_page]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/SkillResource'
