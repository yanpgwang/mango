      type: [string, 'null']
      format: date-time
    Cursor:
      type: [string, 'null']

    ModelInput:
      oneOf:
        - type: string
          minLength: 1
        - type: object
          additionalProperties: false
          required: [id]
          properties:
            id:
              type: string
              minLength: 1
            effort:
              oneOf:
                - $ref: '#/components/schemas/ModelEffortLevel'
                - $ref: '#/components/schemas/ModelEffort'
            speed:
              type: string
              enum: [standard, fast]
    ModelEffortLevel:
      type: string
      enum: [low, medium, high, xhigh, max]
    ModelEffort:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          $ref: '#/components/schemas/ModelEffortLevel'
    Model:
      type: object
      additionalProperties: false
      required: [id, effort, speed]
      properties:
        id:
          type: string
        effort:
          $ref: '#/components/schemas/ModelEffort'
        speed:
          type: string
          enum: [standard, fast]

    MonetaryAmount:
      type: object
      additionalProperties: false
      required: [amount, currency]
      properties:
        amount:
          type: string
          pattern: '^(0|[1-9][0-9]*)$'
          description: Integer minor currency units represented without floating-point rounding.
        currency:
          type: string
          const: USD
    SessionBudgetLimit:
      type: object
      additionalProperties: false
      required: [type, max_list_cost]
      properties:
        type:
          type: string
          const: limit
        max_list_cost:
          $ref: '#/components/schemas/MonetaryAmount'
    NullableSessionBudget:
      anyOf:
        - $ref: '#/components/schemas/SessionBudgetLimit'
        - type: 'null'

    PermissionPolicy:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          type: string
          enum: [always_allow, always_ask]
    ToolDefaultConfig:
      type: object
      additionalProperties: false
      properties:
        enabled:
          type: boolean
        permission_policy:
          $ref: '#/components/schemas/PermissionPolicy'
    ToolConfig:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        enabled:
          type: boolean
        permission_policy:
          $ref: '#/components/schemas/PermissionPolicy'
    BuiltinToolset:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          type: string
          const: agent_toolset_20260401
        default_config:
          $ref: '#/components/schemas/ToolDefaultConfig'
        configs:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/ToolConfig'
              - type: object
                properties:
                  name:
                    type: string
                    enum: [bash, read, write, edit, glob, grep, web_fetch, web_search]
    MCPToolset:
      type: object
      additionalProperties: false
      required: [type, mcp_server_name]
      properties:
        type:
          type: string
          const: mcp_toolset
        mcp_server_name:
          type: string
          minLength: 1
          maxLength: 255
        default_config:
          $ref: '#/components/schemas/ToolDefaultConfig'
        configs:
          type: array
          items:
            $ref: '#/components/schemas/ToolConfig'
    CustomTool:
      type: object
      additionalProperties: false
      required: [type, name, description, input_schema]
      properties:
        type:
          type: string
          const: custom
        name:
          type: string
          pattern: '^[a-zA-Z0-9_-]{1,128}$'
        description:
          type: string
          minLength: 1
          maxLength: 4096
        input_schema:
          type: object
          required: [type]
          properties:
            type:
              type: string
              const: object
          additionalProperties: true
    AgentTool:
      oneOf:
        - $ref: '#/components/schemas/BuiltinToolset'
        - $ref: '#/components/schemas/MCPToolset'
        - $ref: '#/components/schemas/CustomTool'
      discriminator:
        propertyName: type
    MCPServer:
      type: object
      additionalProperties: false
      required: [type, name, url]
      properties:
        type:
          type: string
          const: url
        name:
          type: string
          minLength: 1
          maxLength: 255
        url:
          type: string
          format: uri
          maxLength: 2048
    CustomSkillReferenceInput:
      type: object
      description: >-
        Mango-owned custom Skill reference resolved to an immutable Version
        before Session execution in a Skill-capable sandbox.
      additionalProperties: false
      required: [type, skill_id]
      properties:
        type:
          type: string
          const: custom
        skill_id:
          type: string
          minLength: 1
        version:
          type: string
          minLength: 1
          pattern: '^\S(?:[\s\S]*\S)?$'
          description: Concrete Version identifier or latest; omission also resolves latest.
    AnthropicSkillReferenceInput:
      type: object
      description: >-
        Upstream Managed Agents union variant. This implementation does not
        mirror Anthropic-managed archives and returns 422 when it is attached.
      additionalProperties: false
      required: [type, skill_id]
      properties:
        type:
          type: string
          const: anthropic
        skill_id:
          type: string
          minLength: 1
        version:
          type: string
          minLength: 1
          pattern: '^\S(?:[\s\S]*\S)?$'
          description: Concrete Version identifier or latest; omission also resolves latest.
    SkillReferenceInput:
      description: >-
        Tagged Skill reference. Custom references are resolved; the currently
        represented Anthropic variant is rejected with an explicit unsupported
        response and carries no stability guarantee.
      oneOf:
        - $ref: '#/components/schemas/CustomSkillReferenceInput'
        - $ref: '#/components/schemas/AnthropicSkillReferenceInput'
    ResolvedSkillReference:
      type: object
      additionalProperties: false
      required: [type, skill_id, version]
      properties:
        type:
          type: string
          const: custom
        skill_id:
          type: string
          minLength: 1
        version:
          type: string
          minLength: 1
    LegacySkillReference:
      description: >-
        Temporary read-only cleanup path for an opaque Skills value written by
        an earlier development checkout. It carries no compatibility guarantee
        and cannot be supplied by current create/update requests or used to
        start a new Session.
      not:
        $ref: '#/components/schemas/ResolvedSkillReference'
    SkillReferenceResponse:
      description: >-
        A resolved custom reference or a temporary read-only cleanup value.
      oneOf:
        - $ref: '#/components/schemas/ResolvedSkillReference'
        - $ref: '#/components/schemas/LegacySkillReference'
    MultiagentAgentReferenceInput:
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          type: string
          const: agent
        id:
          type: string
          minLength: 1
        version:
          type: integer
          minimum: 1
    MultiagentSelfReferenceInput:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          type: string
          const: self
    MultiagentAdvisor:
      type: object
      description: >-
        Mango-managed advisor roster entry. At most one may appear in a roster;
        it is echoed last and currently uses the reserved name anthropic.advisor.
        Execution uses an ordinary private client tool and a
        separate tool-free inference with the configured model.
      additionalProperties: false
      required: [type, model]
      properties:
        type:
          type: string
          const: advisor
        model:
          type: string
          minLength: 1
    MultiagentRosterEntryInput:
      oneOf:
        - type: string
          minLength: 1
        - $ref: '#/components/schemas/MultiagentAgentReferenceInput'
        - $ref: '#/components/schemas/MultiagentSelfReferenceInput'
        - $ref: '#/components/schemas/MultiagentAdvisor'
    MultiagentInput:
      type: [object, 'null']
      additionalProperties: false
      required: [type, agents]
      properties:
        type:
          type: string
          const: coordinator
        agents:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: '#/components/schemas/MultiagentRosterEntryInput'
    ResolvedAgentReference:
      type: object
      additionalProperties: false
      required: [type, id, version]
      properties:
        type:
          type: string
          const: agent
        id:
          type: string
          minLength: 1
        version:
          type: integer
          minimum: 1
    ResolvedMultiagent:
      type: object
      additionalProperties: false
      required: [type, agents]
      properties:
        type:
          type: string
          const: coordinator
        agents:
          type: array
          minItems: 1
          maxItems: 20
          items:
            oneOf:
              - $ref: '#/components/schemas/ResolvedAgentReference'
              - $ref: '#/components/schemas/MultiagentAdvisor'
            discriminator:
              propertyName: type
    LegacyMultiagent:
      type: object
      description: >-
        Temporary read-only cleanup path for an opaque topology written by an
        earlier development checkout. It carries no compatibility guarantee and
        must be replaced before update or Session creation.
      additionalProperties: true
    Multiagent:
      description: >-
        A resolved coordinator topology with an immutable concrete Agent
        Version roster, a read-only pre-upgrade value, or null.
      anyOf:
        - $ref: '#/components/schemas/ResolvedMultiagent'
        - $ref: '#/components/schemas/LegacyMultiagent'
        - type: 'null'
    SessionResolvedMultiagent:
      type: object
      additionalProperties: false
      required: [type, agents]
      properties:
        type:
          type: string
          const: coordinator
        agents:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: '#/components/schemas/SessionThreadAgent'
    SessionMultiagent:
      description: >-
        Full immutable Agent definitions resolved when the Session is created.
        The other alternatives are temporary cleanup paths for development data
        and carry no compatibility guarantee.
      anyOf:
        - $ref: '#/components/schemas/SessionResolvedMultiagent'
        - $ref: '#/components/schemas/ResolvedMultiagent'
        - $ref: '#/components/schemas/LegacyMultiagent'
        - type: 'null'

