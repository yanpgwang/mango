      type: object
      maxProperties: 16
      propertyNames:
        minLength: 1
        maxLength: 64
      additionalProperties:
        type: string
        maxLength: 512
    VaultMetadataPatch:
      type: object
      propertyNames:
        minLength: 1
        maxLength: 64
      additionalProperties:
        type: [string, 'null']
        maxLength: 512
    VaultCreateRequest:
      type: object
      additionalProperties: false
      required: [display_name]
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 255
        metadata:
          $ref: '#/components/schemas/VaultMetadata'
    VaultUpdateRequest:
      type: object
      additionalProperties: false
      properties:
        display_name:
          description: Null leaves the existing display name unchanged.
          type: [string, 'null']
          minLength: 1
          maxLength: 255
        metadata:
          description: Null clears all metadata; object values patch individual keys.
          oneOf:
            - $ref: '#/components/schemas/VaultMetadataPatch'
            - type: 'null'
    Vault:
      type: object
      additionalProperties: false
      required: [id, type, display_name, metadata, created_at, updated_at, archived_at]
      properties:
        id:
          type: string
          pattern: '^vlt_'
        type:
          type: string
          const: vault
        display_name:
          type: string
        metadata:
          $ref: '#/components/schemas/VaultMetadata'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        archived_at:
          $ref: '#/components/schemas/NullableTimestamp'
    VaultList:
      type: object
      additionalProperties: false
      required: [data, next_page]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Vault'
        next_page:
          $ref: '#/components/schemas/Cursor'
    VaultDeleted:
      type: object
      additionalProperties: false
      required: [id, type]
      properties:
        id:
          type: string
          pattern: '^vlt_'
        type:
          type: string
          const: vault_deleted

    WebhookEventType:
      type: string
      enum:
        - session.status_scheduled
        - session.status_run_started
        - session.status_idled
        - session.status_rescheduled
        - session.status_terminated
        - session.budget_reached
        - session.thread_created
        - session.thread_idled
        - session.thread_terminated
        - session.outcome_evaluation_ended
        - session.updated
        - session.archived
        - session.deleted
        - deployment_run.succeeded
        - deployment_run.failed
    WebhookCreateRequest:
      type: object
      additionalProperties: false
      required: [url, event_types]
      properties:
        url:
          type: string
          format: uri
          pattern: '^https://'
          maxLength: 2048
        event_types:
          type: array
          minItems: 1
          maxItems: 64
