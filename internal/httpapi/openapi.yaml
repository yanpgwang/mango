        state: {$ref: '#/components/schemas/EnvironmentWorkState'}
        ttl_seconds: {type: integer, minimum: 1}
    EnvironmentWorkQueueStats:
      type: object
      additionalProperties: false
      required: [depth, oldest_queued_at, pending, type, workers_polling]
      properties:
        type: {type: string, const: work_queue_stats}
        depth: {type: integer, minimum: 0}
        pending: {type: integer, minimum: 0}
        workers_polling: {type: integer, minimum: 0}
        oldest_queued_at: {$ref: '#/components/schemas/NullableTimestamp'}

    AgentReference:
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          type: string
          const: agent
        id:
          type: string
          minLength: 1
        version:
          type: integer
          minimum: 1
    AgentWithOverrides:
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          type: string
          const: agent_with_overrides
        id:
          type: string
          minLength: 1
        version:
          type: integer
          minimum: 1
        model:
          $ref: '#/components/schemas/ModelInput'
        system:
          type: [string, 'null']
        tools:
          oneOf:
            - type: array
              maxItems: 128
              items:
                $ref: '#/components/schemas/AgentTool'
            - type: 'null'
        mcp_servers:
          oneOf:
            - type: array
              maxItems: 20
              items:
                $ref: '#/components/schemas/MCPServer'
            - type: 'null'
        skills:
          oneOf:
            - type: array
              maxItems: 500
              items:
                $ref: '#/components/schemas/SkillReferenceInput'
            - type: 'null'
    SessionAgentInput:
      oneOf:
        - type: string
          minLength: 1
        - $ref: '#/components/schemas/AgentReference'
        - $ref: '#/components/schemas/AgentWithOverrides'
    TextBlockInput:
      type: object
      additionalProperties: false
      required: [type, text]
      properties:
        type:
          type: string
          const: text
        text:
          type: string
    Base64ImageSourceInput:
      type: object
      additionalProperties: false
      required: [type, data, media_type]
      properties:
        type: {type: string, const: base64}
        data: {type: string}
        media_type: {type: string}
    URLImageSourceInput:
      type: object
      additionalProperties: false
      required: [type, url]
      properties:
        type: {type: string, const: url}
        url: {type: string}
    FileImageSourceInput:
      type: object
      description: Documented wire shape; Mango currently rejects File-sourced images.
      additionalProperties: false
      required: [type, file_id]
      properties:
        type: {type: string, const: file}
        file_id: {type: string, minLength: 1}
    ImageSourceInput:
      oneOf:
        - $ref: '#/components/schemas/Base64ImageSourceInput'
        - $ref: '#/components/schemas/URLImageSourceInput'
        - $ref: '#/components/schemas/FileImageSourceInput'
      discriminator:
        propertyName: type
    ImageBlockInput:
      type: object
      additionalProperties: false
      required: [type, source]
      properties:
        type:
          type: string
          const: image
        source:
          $ref: '#/components/schemas/ImageSourceInput'
    Base64DocumentSourceInput:
      type: object
      additionalProperties: false
      required: [type, data, media_type]
      properties:
        type: {type: string, const: base64}
        data: {type: string}
        media_type: {type: string}
    TextDocumentSourceInput:
      type: object
      additionalProperties: false
      required: [type, data, media_type]
      properties:
        type: {type: string, const: text}
        data: {type: string}
        media_type: {type: string, const: text/plain}
    URLDocumentSourceInput:
      type: object
      additionalProperties: false
      required: [type, url]
      properties:
        type: {type: string, const: url}
        url: {type: string}
    FileDocumentSourceInput:
      type: object
      description: >-
        A previously uploaded File. Mango supports this source only for
        user.message documents whose ready top-level File can be projected as
        bounded UTF-8 text; PDF, image, and other non-text Files are rejected.
      additionalProperties: false
      required: [type, file_id]
      properties:
        type: {type: string, const: file}
        file_id: {type: string, minLength: 1}
    DocumentSourceInput:
      oneOf:
        - $ref: '#/components/schemas/Base64DocumentSourceInput'
        - $ref: '#/components/schemas/TextDocumentSourceInput'
        - $ref: '#/components/schemas/URLDocumentSourceInput'
        - $ref: '#/components/schemas/FileDocumentSourceInput'
      discriminator:
        propertyName: type
    DocumentBlockInput:
      type: object
      additionalProperties: false
      required: [type, source]
      properties:
        type:
          type: string
          const: document
        source:
          $ref: '#/components/schemas/DocumentSourceInput'
        context: {type: string}
        title: {type: string}
    MessageContentInput:
      oneOf:
        - $ref: '#/components/schemas/TextBlockInput'
        - $ref: '#/components/schemas/ImageBlockInput'
        - $ref: '#/components/schemas/DocumentBlockInput'
      discriminator:
        propertyName: type
    UserMessageInitialEvent:
      type: object
      additionalProperties: false
      required: [type, content]
      properties:
        type:
          type: string
          const: user.message
        content:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            $ref: '#/components/schemas/MessageContentInput'
    TextRubric:
      type: object
      additionalProperties: false
      required: [type, content]
      properties:
        type:
          type: string
          const: text
        content:
          type: string
          minLength: 1
          maxLength: 262144
    FileRubric:
      type: object
      description: Reusable UTF-8 rubric resolved from a ready top-level File in the caller's Workspace.
      additionalProperties: false
      required: [type, file_id]
      properties:
        type:
          type: string
          const: file
        file_id:
          type: string
          minLength: 1
          description: ID of a File uploaded through the Files API.
    OutcomeRubric:
      oneOf:
        - $ref: '#/components/schemas/TextRubric'
        - $ref: '#/components/schemas/FileRubric'
      discriminator:
        propertyName: type
    DefineOutcomeInitialEvent:
      type: object
      additionalProperties: false
      required: [type, description, rubric]
      properties:
        type:
          type: string
          const: user.define_outcome
        description:
          type: string
          minLength: 1
        rubric:
          $ref: '#/components/schemas/OutcomeRubric'
        max_iterations:
          type: integer
          minimum: 1
          maximum: 20
    InitialEvent:
      oneOf:
        - $ref: '#/components/schemas/UserMessageInitialEvent'
        - $ref: '#/components/schemas/DefineOutcomeInitialEvent'
      discriminator:
        propertyName: type
    SessionCreateRequest:
      type: object
      additionalProperties: false
      required: [agent, environment_id]
      properties:
        agent:
          $ref: '#/components/schemas/SessionAgentInput'
        environment_id:
          type: string
          minLength: 1
        title:
          type: string
        metadata:
          $ref: '#/components/schemas/Metadata'
        initial_events:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/InitialEvent'
        resources:
          type: array
          maxItems: 500
          description: At most eight entries may be Memory Stores; Memory Stores attach only at creation.
          items:
            $ref: '#/components/schemas/SessionResourceInput'
        vault_ids:
          type: array
          description: Ordered Vault references used to resolve runtime credentials. The first Vault with a matching credential wins.
          items:
            type: string
        budget:
          $ref: '#/components/schemas/NullableSessionBudget'
          description: >-
            Optional Session-wide public-list-cost ceiling. Every model in the resolved
            multiagent roster must have a known Anthropic public list price.
    SessionAgentUpdate:
      type: object
      additionalProperties: false
      properties:
        tools:
          oneOf:
            - type: array
              maxItems: 128
              items:
                $ref: '#/components/schemas/AgentTool'
            - type: 'null'
        mcp_servers:
          oneOf:
            - type: array
              maxItems: 20
              items:
                $ref: '#/components/schemas/MCPServer'
            - type: 'null'
    SessionUpdateRequest:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
        metadata:
          $ref: '#/components/schemas/MetadataPatch'
        agent:
          $ref: '#/components/schemas/SessionAgentUpdate'
        vault_ids:
          description: Reserved and rejected with 422 when present.
          type: array
          items:
            type: string
        budget:
          $ref: '#/components/schemas/NullableSessionBudget'
          description: >-
            A budget can be changed or removed only when the Session was created with
            one. After removal it cannot be added again. A changed maximum must be
            strictly greater than the exact list cost already consumed.
    SessionStatus:
      type: string
      enum: [idle, running, rescheduling, terminated]
    FileSessionResourceInput:
      type: object
      additionalProperties: false
      required: [type, file_id]
      properties:
        type:
          type: string
          const: file
        file_id:
          type: string
          minLength: 1
        mount_path:
          type: string
          minLength: 1
          description: Absolute path normalized beneath /mnt/session/uploads.
    MemoryStoreSessionResourceInput:
      type: object
      additionalProperties: false
      required: [type, memory_store_id]
      properties:
        type:
          type: string
          const: memory_store
        memory_store_id:
          type: string
          pattern: '^memstore_'
        access:
          type: string
          enum: [read_write, read_only]
          default: read_write
        instructions:
          type: string
          maxLength: 4096
    SessionResourceInput:
      oneOf:
        - $ref: '#/components/schemas/FileSessionResourceInput'
        - $ref: '#/components/schemas/MemoryStoreSessionResourceInput'
        - $ref: '#/components/schemas/GitRepositorySessionResourceInput'
      discriminator:
        propertyName: type
    GitRepositoryBranchCheckout:
      type: object
      additionalProperties: false
      required: [type, name]
      properties:
        type:
          type: string
          const: branch
        name:
          type: string
          minLength: 1
          maxLength: 1024
    GitRepositoryCommitCheckout:
      type: object
      additionalProperties: false
      required: [type, sha]
      properties:
        type:
          type: string
          const: commit
        sha:
          type: string
          pattern: '^[0-9a-fA-F]{40}$'
    GitRepositoryCheckout:
      oneOf:
        - $ref: '#/components/schemas/GitRepositoryBranchCheckout'
        - $ref: '#/components/schemas/GitRepositoryCommitCheckout'
      discriminator:
        propertyName: type
    GitRepositorySessionResourceInput:
      type: object
      additionalProperties: false
      required: [type, url]
      properties:
        type:
          type: string
          const: git_repository
        url:
          type: string
          format: uri
          pattern: '^https://'
          maxLength: 2048
          description: Anonymous public HTTPS Git remote. Credentials, query strings, and fragments are rejected.
        checkout:
          $ref: '#/components/schemas/GitRepositoryCheckout'
        mount_path:
          type: string
          minLength: 1
          maxLength: 1024
          description: Absolute child of /workspace that does not overlap /workspace/skills.
    FileSessionResource:
      type: object
      additionalProperties: false
      required: [id, created_at, file_id, mount_path, type, updated_at]
      properties:
        id:
          type: string
          pattern: '^sesrsc_'
        created_at:
          type: string
          format: date-time
        file_id:
          type: string
          pattern: '^file_'
          description: Independent downloadable Session-scoped File copy.
        mount_path:
          type: string
        type:
          type: string
          const: file
        updated_at:
          type: string
          format: date-time
    MemoryStoreSessionResource:
      type: object
      additionalProperties: false
      required: [memory_store_id, type, access, description, instructions, mount_path, name]
      properties:
        memory_store_id:
          type: string
          pattern: '^memstore_'
        type:
          type: string
          const: memory_store
        access:
          type: string
          enum: [read_write, read_only]
        description:
          type: string
        instructions:
          type: [string, 'null']
        mount_path:
          type: string
          pattern: '^/mnt/memory/'
        name:
          type: string
    SessionResource:
      oneOf:
        - $ref: '#/components/schemas/FileSessionResource'
        - $ref: '#/components/schemas/MemoryStoreSessionResource'
        - $ref: '#/components/schemas/GitRepositorySessionResource'
      discriminator:
        propertyName: type
    GitRepositorySessionResource:
      type: object
      additionalProperties: false
      required: [id, created_at, type, url, checkout, resolved_commit, mount_path, updated_at]
      properties:
        id:
          type: string
          pattern: '^sesrsc_'
        created_at:
          type: string
          format: date-time
        type:
          type: string
          const: git_repository
        url:
          type: string
          format: uri
        checkout:
          oneOf:
            - $ref: '#/components/schemas/GitRepositoryCheckout'
            - type: 'null'
          description: Requested checkout, or null when the remote default branch was used.
        resolved_commit:
          type: string
          pattern: '^[0-9a-f]{40}$'
          description: Exact commit frozen into the Session snapshot.
        mount_path:
          type: string
          pattern: '^/workspace/'
        updated_at:
          type: string
          format: date-time
    SessionResourceDeleted:
      type: object
      additionalProperties: false
      required: [id, type]
      properties:
        id:
          type: string
          pattern: '^sesrsc_'
        type:
          type: string
          const: session_resource_deleted
    SessionResourceList:
      type: object
      additionalProperties: false
      required: [data, has_more, next_page]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/SessionResource'
        has_more:
          type: boolean
        next_page:
          $ref: '#/components/schemas/Cursor'
    SessionStats:
      type: object
      additionalProperties: false
      required: [active_seconds, duration_seconds]
      properties:
        active_seconds:
          type: number
          minimum: 0
        duration_seconds:
          type: number
          minimum: 0
    SessionUsage:
      type: object
      additionalProperties: false
      required:
        - active_seconds
        - cache_creation
        - cache_read_input_tokens
        - input_tokens
        - list_cost
        - output_tokens
        - server_tool_use
      properties:
        active_seconds:
          type: number
          minimum: 0
        cache_creation:
          type: object
          additionalProperties: false
          required: [ephemeral_1h_input_tokens, ephemeral_5m_input_tokens]
          properties:
            ephemeral_1h_input_tokens:
              type: integer
              minimum: 0
            ephemeral_5m_input_tokens:
              type: integer
              minimum: 0
        cache_read_input_tokens:
          type: integer
          minimum: 0
        input_tokens:
          type: integer
          minimum: 0
        list_cost:
          anyOf:
            - $ref: '#/components/schemas/MonetaryAmount'
            - type: 'null'
        output_tokens:
          type: integer
          minimum: 0
        server_tool_use:
          type: object
          additionalProperties: false
          required: [web_fetch_requests, web_search_requests]
          properties:
            web_fetch_requests: {type: integer, minimum: 0}
            web_search_requests: {type: integer, minimum: 0}
    SessionUsageSnapshot:
      description: Budget-event usage snapshot; list cost is always measurable and non-null.
      allOf:
        - $ref: '#/components/schemas/SessionUsage'
        - type: object
          properties:
            list_cost: {$ref: '#/components/schemas/MonetaryAmount'}
    OutcomeEvaluation:
      type: object
      description: >-
        Tool-free model evaluation of a rubric and candidate conversation
        evidence. The grader cannot independently read output Files, fetch
        URLs, or execute tests; a passing result is not artifact verification.
      additionalProperties: false
      required: [type, outcome_id, description, result, explanation, iteration, completed_at]
      properties:
        type:
          type: string
          const: outcome_evaluation
        outcome_id:
          type: string
        description:
          type: string
        result:
          type: string
        explanation:
          type: [string, 'null']
        iteration:
          type: integer
          minimum: 0
        completed_at:
          $ref: '#/components/schemas/NullableTimestamp'
    Session:
      type: object
      additionalProperties: false
      required:
        - id
        - type
        - status
        - agent
        - budget
        - environment_id
        - title
        - metadata
        - outcome_evaluations
        - resources
        - stats
        - usage
        - vault_ids
        - deployment_id
        - created_at
        - updated_at
        - archived_at
      properties:
        id:
          type: string
        type:
          type: string
          const: session
        status:
          $ref: '#/components/schemas/SessionStatus'
        agent:
          $ref: '#/components/schemas/AgentSnapshot'
        budget:
          $ref: '#/components/schemas/NullableSessionBudget'
        environment_id:
          type: string
        title:
          type: string
        metadata:
          $ref: '#/components/schemas/Metadata'
        outcome_evaluations:
          type: array
          items:
            $ref: '#/components/schemas/OutcomeEvaluation'
        resources:
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/SessionResource'
        stats:
          $ref: '#/components/schemas/SessionStats'
        usage:
          $ref: '#/components/schemas/SessionUsage'
        vault_ids:
          type: array
          items:
            type: string
        deployment_id:
          type: 'null'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        archived_at:
          $ref: '#/components/schemas/NullableTimestamp'
    SessionList:
      type: object
      additionalProperties: false
      required: [data, next_page, prev_page]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Session'
        next_page:
          $ref: '#/components/schemas/Cursor'
        prev_page:
          $ref: '#/components/schemas/Cursor'
    SessionThreadStats:
      type: object
      additionalProperties: false
      required: [active_seconds, duration_seconds, startup_seconds]
      properties:
        active_seconds: {type: number, minimum: 0}
        duration_seconds: {type: number, minimum: 0}
        startup_seconds: {type: number, minimum: 0}
    SessionThread:
      type: object
      additionalProperties: false
      required: [id, type, session_id, parent_thread_id, agent, status, stats, usage, created_at, updated_at, archived_at]
      properties:
        id: {type: string, pattern: '^sthr_'}
        type: {type: string, const: session_thread}
        session_id: {type: string, pattern: '^sesn_'}
        parent_thread_id: {type: [string, 'null'], pattern: '^sthr_'}
        agent: {$ref: '#/components/schemas/SessionThreadAgent'}
        status: {$ref: '#/components/schemas/SessionStatus'}
        stats: {$ref: '#/components/schemas/SessionThreadStats'}
        usage: {$ref: '#/components/schemas/SessionUsage'}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        archived_at: {$ref: '#/components/schemas/NullableTimestamp'}
    SessionThreadList:
      type: object
      additionalProperties: false
      required: [data, next_page]
      properties:
        data:
          type: array
          items: {$ref: '#/components/schemas/SessionThread'}
        next_page: {$ref: '#/components/schemas/Cursor'}
    SessionDeleted:
      type: object
      additionalProperties: false
      required: [id, type]
      properties:
        id:
          type: string
        type:
          type: string
          const: session_deleted

    SearchResultBlock:
      type: object
      additionalProperties: false
      required: [type, source, title, citations, content]
      properties:
        type:
          type: string
          const: search_result
        source:
          type: string
        title:
          type: string
        citations:
          type: object
          additionalProperties: false
          required: [enabled]
          properties:
            enabled:
              type: boolean
        content:
          type: array
          items:
            $ref: '#/components/schemas/TextBlockInput'
    ResultContentInput:
      oneOf:
        - $ref: '#/components/schemas/TextBlockInput'
        - $ref: '#/components/schemas/ImageBlockInput'
        - $ref: '#/components/schemas/DocumentBlockInput'
        - $ref: '#/components/schemas/SearchResultBlock'
      discriminator:
        propertyName: type
    UserMessageEventInput:
      type: object
      additionalProperties: false
      required: [type, content]
      properties:
        type:
          type: string
          const: user.message
        content:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            $ref: '#/components/schemas/MessageContentInput'
    UserInterruptEventInput:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          type: string
          const: user.interrupt
        session_thread_id:
          description: If omitted, interrupts every non-archived Thread; otherwise interrupts only the named Thread.
          type: string
          minLength: 1
          pattern: '^sthr_'
    UserToolConfirmationEventInput:
      description: >-
        Approves or denies an always_ask tool call. For a self-hosted built-in,
        allow is processed on admission and authorizes external execution but
        keeps the original action pending until user.tool_result. Deny requires
        no client result and never executes the tool. Duplicate approvals return 409.
      type: object
      additionalProperties: false
      required: [type, tool_use_id, result]
      properties:
        type:
          type: string
          const: user.tool_confirmation
        tool_use_id:
          type: string
          minLength: 1
        result:
          type: string
          enum: [allow, deny]
        deny_message:
          description: Valid only when result is deny.
          type: string
        session_thread_id:
          description: Optional redundant routing hint copied from a cross-posted child tool-use event.
          type: string
          pattern: '^sthr_'
    UserCustomToolResultEventInput:
      type: object
      additionalProperties: false
      required: [type, custom_tool_use_id]
      properties:
        type:
          type: string
          const: user.custom_tool_result
        custom_tool_use_id:
          type: string
          minLength: 1
        content:
          type: array
          maxItems: 1000
          items:
            $ref: '#/components/schemas/ResultContentInput'
        is_error:
          type: boolean
        session_thread_id:
          description: Optional redundant routing hint copied from a cross-posted child custom-tool-use event.
          type: string
          pattern: '^sthr_'
    UserToolResultEventInput:
      description: >-
        Resolves an externally executed built-in using its original tool_use_id.
        An always_ask call requires a committed allow first; premature results
        and results after denial return 400. Duplicate results return 409.
      type: object
      additionalProperties: false
      required: [type, tool_use_id]
      properties:
        type:
          type: string
          const: user.tool_result
        tool_use_id:
          type: string
          minLength: 1
        content:
          type: array
          maxItems: 1000
          items:
            $ref: '#/components/schemas/ResultContentInput'
        is_error:
          type: boolean
        session_thread_id:
          description: Optional redundant routing hint copied from a cross-posted child tool-use event.
          type: string
          pattern: '^sthr_'
    UserDefineOutcomeEventInput:
      type: object
      additionalProperties: false
      required: [type, description, rubric]
      properties:
        type:
          type: string
          const: user.define_outcome
        description:
          type: string
          minLength: 1
        rubric:
          $ref: '#/components/schemas/OutcomeRubric'
        max_iterations:
          type: integer
          minimum: 1
          maximum: 20
          default: 3
    SystemMessageEventInput:
      type: object
      description: Must be the final companion to a user message or tool-result event in the same batch.
      additionalProperties: false
      required: [type, content]
      properties:
        type:
          type: string
          const: system.message
        content:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            $ref: '#/components/schemas/TextBlockInput'
    ClientSessionEventInput:
      oneOf:
        - $ref: '#/components/schemas/UserMessageEventInput'
        - $ref: '#/components/schemas/UserInterruptEventInput'
        - $ref: '#/components/schemas/UserToolConfirmationEventInput'
        - $ref: '#/components/schemas/UserCustomToolResultEventInput'
        - $ref: '#/components/schemas/UserDefineOutcomeEventInput'
        - $ref: '#/components/schemas/UserToolResultEventInput'
        - $ref: '#/components/schemas/SystemMessageEventInput'
      discriminator:
        propertyName: type
    SendSessionEventsRequest:
      type: object
      additionalProperties: false
      required: [events]
      properties:
        events:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ClientSessionEventInput'

    CoreSessionEventType:
      type: string
      enum:
        - user.message
        - user.interrupt
        - user.tool_confirmation
        - user.custom_tool_result
        - user.tool_result
