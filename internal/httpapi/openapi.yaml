        id:
          type: string
          pattern: '^[0-9]+$'
        created_at:
          type: string
          format: date-time
        description:
          type: string
          minLength: 1
          maxLength: 1024
        directory:
          type: string
          minLength: 1
        name:
          type: string
          pattern: '^[a-z0-9-]+$'
          maxLength: 64
        skill_id:
          type: string
          pattern: '^skill_'
        type:
          type: string
          const: skill_version
        version:
          type: string
          pattern: '^[0-9]+$'
    SkillVersionList:
      type: object
      additionalProperties: false
