openapi: 3.1.0
info:
  title: mango
  version: 0.1.0
  description: >-
    Mango's current HTTP API for durable Sessions, Deployments, self-hosted
    Environment Work, conditional Files and Memory APIs, Vaults, Webhooks, and
    File- and Memory-backed Session Resources. Mango is an independent, self-hosted
    runtime licensed under Apache-2.0.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: /
    description: Current mango server
security:
  - BearerAuth: []
tags:
  - name: Agents
    description: Versioned Agent definitions.
  - name: Environments
    description: Session execution environments.
  - name: Environment Work
    description: Lease and activation protocol for self-hosted Environment workers.
  - name: Sessions
    description: Durable single-agent Sessions.
  - name: Session Events
    description: Durable Session input and output events.
  - name: Session Threads
    description: Durable primary execution identities and thread-scoped event views.
  - name: Session Resources
    description: File copies and Memory Stores attached to durable Sessions.
  - name: Files
    description: Durable file metadata and S3-compatible byte storage.
  - name: Skills
    description: >-
      Custom filesystem Skills with immutable archived Versions and
      provider-capability-gated Session materialization. Self-hosted Sessions
      with custom Skills are rejected at creation; external worker Skill
      activation is not implemented.
  - name: Memory
    description: Persistent path-addressed Memory Stores with immutable audit Versions.
  - name: Vaults
    description: Encrypted credential storage for Managed Agent Sessions.
  - name: Webhooks
    description: Durable, signed outbound notifications for lifecycle changes.
  - name: Deployments
    description: Autonomous Session templates and their execution records.
paths:
  /v1/agents:
    post:
      operationId: createAgent
      tags: [Agents]
      summary: Create an Agent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentCreateRequest'
      responses:
        '200':
          $ref: '#/components/responses/AgentResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '422':
          $ref: '#/components/responses/UnsupportedRequest'
    get:
      operationId: listAgents
      tags: [Agents]
      summary: List Agents
      parameters:
        - $ref: '#/components/parameters/AgentListLimit'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/IncludeArchived'
        - $ref: '#/components/parameters/CreatedAtGte'
        - $ref: '#/components/parameters/CreatedAtLte'
      responses:
        '200':
          $ref: '#/components/responses/AgentListResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
  /v1/agents/{agent_id}:
    parameters:
      - $ref: '#/components/parameters/AgentID'
    get:
      operationId: getAgent
      tags: [Agents]
      summary: Get an Agent
      responses:
        '200':
          $ref: '#/components/responses/AgentResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: updateAgent
      tags: [Agents]
      summary: Update an Agent and create a new version when fields change
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentUpdateRequest'
      responses:
        '200':
          $ref: '#/components/responses/AgentResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnsupportedRequest'
  /v1/agents/{agent_id}/versions:
    parameters:
      - $ref: '#/components/parameters/AgentID'
    get:
      operationId: listAgentVersions
      tags: [Agents]
      summary: List Agent versions
      parameters:
        - $ref: '#/components/parameters/AgentListLimit'
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          $ref: '#/components/responses/AgentListResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/agents/{agent_id}/archive:
    parameters:
      - $ref: '#/components/parameters/AgentID'
    post:
      operationId: archiveAgent
      tags: [Agents]
      summary: Archive an Agent
      responses:
        '200':
          $ref: '#/components/responses/AgentResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/environments:
    post:
      operationId: createEnvironment
      tags: [Environments]
      summary: Create an Environment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnvironmentCreateRequest'
      responses:
        '200':
          $ref: '#/components/responses/EnvironmentResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '422':
          $ref: '#/components/responses/UnsupportedRequest'
    get:
      operationId: listEnvironments
      tags: [Environments]
      summary: List Environments
      parameters:
        - $ref: '#/components/parameters/EnvironmentListLimit'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/IncludeArchived'
      responses:
        '200':
          $ref: '#/components/responses/EnvironmentListResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
  /v1/environments/{environment_id}:
    parameters:
      - $ref: '#/components/parameters/EnvironmentID'
    get:
      operationId: getEnvironment
      tags: [Environments]
      summary: Get an Environment
      responses:
        '200':
          $ref: '#/components/responses/EnvironmentResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: updateEnvironment
      tags: [Environments]
      summary: Update an Environment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnvironmentUpdateRequest'
      responses:
        '200':
          $ref: '#/components/responses/EnvironmentResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnsupportedRequest'
    delete:
      operationId: deleteEnvironment
      tags: [Environments]
      summary: Delete an unreferenced Environment
      responses:
        '200':
          $ref: '#/components/responses/EnvironmentDeletedResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/environments/{environment_id}/archive:
    parameters:
      - $ref: '#/components/parameters/EnvironmentID'
    post:
      operationId: archiveEnvironment
      tags: [Environments]
      summary: Archive an Environment
      responses:
        '200':
          $ref: '#/components/responses/EnvironmentResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/environments/{environment_id}/work:
    parameters:
      - $ref: '#/components/parameters/EnvironmentID'
    get:
      operationId: listEnvironmentWork
      tags: [Environment Work]
      summary: List self-hosted Environment Work items
      parameters:
        - $ref: '#/components/parameters/EnvironmentWorkListLimit'
        - $ref: '#/components/parameters/Page'
      responses:
        '200': {$ref: '#/components/responses/EnvironmentWorkListResponse'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
  /v1/environments/{environment_id}/work/poll:
    parameters:
      - $ref: '#/components/parameters/EnvironmentID'
    get:
      operationId: pollEnvironmentWork
      tags: [Environment Work]
      summary: Poll and tentatively claim the oldest available Work item
      parameters:
        - $ref: '#/components/parameters/EnvironmentWorkBlockMs'
        - $ref: '#/components/parameters/EnvironmentWorkReclaimMs'
        - $ref: '#/components/parameters/EnvironmentWorkerID'
      responses:
        '200': {$ref: '#/components/responses/EnvironmentWorkPollResponse'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
  /v1/environments/{environment_id}/work/stats:
    parameters:
      - $ref: '#/components/parameters/EnvironmentID'
    get:
      operationId: getEnvironmentWorkStats
      tags: [Environment Work]
      summary: Get Environment Work queue statistics
      responses:
        '200': {$ref: '#/components/responses/EnvironmentWorkStatsResponse'}
        '404': {$ref: '#/components/responses/NotFound'}
  /v1/environments/{environment_id}/work/{work_id}:
    parameters:
      - $ref: '#/components/parameters/EnvironmentID'
      - $ref: '#/components/parameters/EnvironmentWorkID'
    get:
      operationId: getEnvironmentWork
      tags: [Environment Work]
      summary: Get an Environment Work item
      responses:
        '200': {$ref: '#/components/responses/EnvironmentWorkResponse'}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      operationId: updateEnvironmentWork
      tags: [Environment Work]
      summary: Merge metadata into an Environment Work item
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EnvironmentWorkUpdateRequest'}
      responses:
        '200': {$ref: '#/components/responses/EnvironmentWorkResponse'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
  /v1/environments/{environment_id}/work/{work_id}/ack:
    parameters:
      - $ref: '#/components/parameters/EnvironmentID'
      - $ref: '#/components/parameters/EnvironmentWorkID'
    post:
      operationId: acknowledgeEnvironmentWork
      tags: [Environment Work]
      summary: Acknowledge a polled Work item and transition it to starting
      responses:
        '200': {$ref: '#/components/responses/EnvironmentWorkResponse'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /v1/environments/{environment_id}/work/{work_id}/heartbeat:
    parameters:
      - $ref: '#/components/parameters/EnvironmentID'
      - $ref: '#/components/parameters/EnvironmentWorkID'
    post:
      operationId: heartbeatEnvironmentWork
      tags: [Environment Work]
      summary: Record a conditional heartbeat and extend the Work lease
      parameters:
        - $ref: '#/components/parameters/EnvironmentWorkExpectedHeartbeat'
        - $ref: '#/components/parameters/EnvironmentWorkDesiredTTL'
      responses:
        '200': {$ref: '#/components/responses/EnvironmentWorkHeartbeatResponse'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
  /v1/environments/{environment_id}/work/{work_id}/stop:
    parameters:
      - $ref: '#/components/parameters/EnvironmentID'
      - $ref: '#/components/parameters/EnvironmentWorkID'
    post:
      operationId: stopEnvironmentWork
      tags: [Environment Work]
      summary: Request graceful or forced Work shutdown
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EnvironmentWorkStopRequest'}
      responses:
        '204':
          description: Work stop accepted; no response body
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}

  /v1/sessions:
    post:
      operationId: createSession
      tags: [Sessions]
      summary: Create a Session
      description: >-
        Custom Skills on the effective primary Agent or any resolved roster
        member require a capable Mango-managed sandbox. Overrides apply before
        this check. Configurations with custom Skills return 422 for self-hosted
        Environments or cloud adapters without Skill support, before any
        Session, Work item, or execution wakeup is created.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionCreateRequest'
      responses:
        '200':
          $ref: '#/components/responses/SessionResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '422':
          $ref: '#/components/responses/UnsupportedRequest'
    get:
      operationId: listSessions
      tags: [Sessions]
      summary: List Sessions
      parameters:
        - $ref: '#/components/parameters/SessionListLimit'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Order'
        - $ref: '#/components/parameters/AgentIDFilter'
        - $ref: '#/components/parameters/AgentVersionFilter'
        - $ref: '#/components/parameters/Statuses'
        - $ref: '#/components/parameters/IncludeArchived'
        - $ref: '#/components/parameters/CreatedAtGt'
        - $ref: '#/components/parameters/CreatedAtGte'
        - $ref: '#/components/parameters/CreatedAtLt'
        - $ref: '#/components/parameters/CreatedAtLte'
        - $ref: '#/components/parameters/DeploymentIDFilter'
        - $ref: '#/components/parameters/MemoryStoreIDFilter'
      responses:
        '200':
          $ref: '#/components/responses/SessionListResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
  /v1/sessions/{session_id}:
    parameters:
      - $ref: '#/components/parameters/SessionID'
    get:
      operationId: getSession
      tags: [Sessions]
      summary: Get a Session
      responses:
        '200':
          $ref: '#/components/responses/SessionResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: updateSession
      tags: [Sessions]
      summary: Update Session metadata, title, or the next-turn tool configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionUpdateRequest'
      responses:
        '200':
          $ref: '#/components/responses/SessionResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnsupportedRequest'
    delete:
      operationId: deleteSession
      tags: [Sessions]
      summary: Delete a non-running Session and its event history
      description: >-
        Performs sandbox cleanup and removes Session-owned Files as well as
        persisted history. Download outputs that must be retained first.
      responses:
        '200':
          $ref: '#/components/responses/SessionDeletedResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/sessions/{session_id}/archive:
    parameters:
      - $ref: '#/components/parameters/SessionID'
    post:
      operationId: archiveSession
      tags: [Sessions]
      summary: Archive a non-running Session
      description: >-
        Prevents further input and retains history and Session Files. Archive
        does not release the sandbox; automatic idle or archive-based sandbox
        reclamation is not implemented.
      responses:
        '200':
          $ref: '#/components/responses/SessionResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /v1/sessions/{session_id}/resources:
    parameters:
      - $ref: '#/components/parameters/SessionID'
    post:
      operationId: addSessionResource
      tags: [Session Resources]
      summary: Attach a File copy to a Session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FileSessionResourceInput'
      responses:
        '200':
          $ref: '#/components/responses/SessionResourceResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '422':
          $ref: '#/components/responses/UnsupportedRequest'
    get:
      operationId: listSessionResources
      tags: [Session Resources]
      summary: List Session Resources
      parameters:
        - $ref: '#/components/parameters/SessionResourceListLimit'
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          $ref: '#/components/responses/SessionResourceListResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnsupportedRequest'

  /v1/sessions/{session_id}/resources/{resource_id}:
    parameters:
      - $ref: '#/components/parameters/SessionID'
      - $ref: '#/components/parameters/SessionResourceID'
    get:
      operationId: getSessionResource
      tags: [Session Resources]
      summary: Get a Session Resource
      responses:
        '200':
          $ref: '#/components/responses/SessionResourceResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnsupportedRequest'
    delete:
      operationId: deleteSessionResource
      tags: [Session Resources]
      summary: Detach a File Resource from a Session
      responses:
        '200':
          $ref: '#/components/responses/SessionResourceDeletedResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnsupportedRequest'

  /v1/sessions/{session_id}/events:
    parameters:
      - $ref: '#/components/parameters/SessionID'
    post:
      operationId: sendSessionEvents
      tags: [Session Events]
      summary: Send Session events
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendSessionEventsRequest'
      responses:
        '200':
          $ref: '#/components/responses/SessionEventBatchResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnsupportedRequest'
    get:
      operationId: listSessionEvents
      tags: [Session Events]
      summary: List Session event history
      parameters:
        - $ref: '#/components/parameters/EventListLimit'
        - $ref: '#/components/parameters/EventOrder'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/EventTypes'
        - $ref: '#/components/parameters/CreatedAtGt'
        - $ref: '#/components/parameters/CreatedAtGte'
        - $ref: '#/components/parameters/CreatedAtLt'
        - $ref: '#/components/parameters/CreatedAtLte'
      responses:
        '200':
          $ref: '#/components/responses/SessionEventListResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/sessions/{session_id}/events/stream:
    parameters:
      - $ref: '#/components/parameters/SessionID'
    get:
      operationId: streamSessionEvents
      tags: [Session Events]
      summary: Stream live Session events over SSE
      parameters:
        - $ref: '#/components/parameters/EventDeltas'
      responses:
        '200':
          description: SSE event stream
          headers:
            request-id:
              $ref: '#/components/headers/RequestID'
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/EventStreamFrame'
              x-sse-event-schemas:
                persisted:
                  $ref: '#/components/schemas/SessionEvent'
                event_start:
                  $ref: '#/components/schemas/EventStart'
                event_delta:
                  $ref: '#/components/schemas/EventDelta'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/sessions/{session_id}/threads:
    parameters:
      - $ref: '#/components/parameters/SessionID'
    get:
      operationId: listSessionThreads
      tags: [Session Threads]
      summary: List Session Threads, primary first
      parameters:
        - $ref: '#/components/parameters/SessionThreadListLimit'
        - $ref: '#/components/parameters/Page'
      responses:
        '200': {$ref: '#/components/responses/SessionThreadListResponse'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
  /v1/sessions/{session_id}/threads/{thread_id}:
    parameters:
      - $ref: '#/components/parameters/SessionID'
      - $ref: '#/components/parameters/SessionThreadID'
    get:
      operationId: getSessionThread
      tags: [Session Threads]
      summary: Get a Session Thread
      responses:
        '200': {$ref: '#/components/responses/SessionThreadResponse'}
        '404': {$ref: '#/components/responses/NotFound'}
  /v1/sessions/{session_id}/threads/{thread_id}/archive:
    parameters:
      - $ref: '#/components/parameters/SessionID'
      - $ref: '#/components/parameters/SessionThreadID'
    post:
      operationId: archiveSessionThread
      tags: [Session Threads]
      summary: Archive a non-running Session Thread
      responses:
        '200': {$ref: '#/components/responses/SessionThreadResponse'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /v1/sessions/{session_id}/threads/{thread_id}/events:
    parameters:
      - $ref: '#/components/parameters/SessionID'
      - $ref: '#/components/parameters/SessionThreadID'
    get:
      operationId: listSessionThreadEvents
      tags: [Session Threads]
      summary: List persisted events for one Session Thread
      parameters:
        - $ref: '#/components/parameters/EventListLimit'
        - $ref: '#/components/parameters/Page'
      responses:
        '200': {$ref: '#/components/responses/SessionEventListResponse'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
  /v1/sessions/{session_id}/threads/{thread_id}/stream:
    parameters:
      - $ref: '#/components/parameters/SessionID'
      - $ref: '#/components/parameters/SessionThreadID'
    get:
      operationId: streamSessionThreadEvents
      tags: [Session Threads]
      summary: Stream live events for one Session Thread over SSE
      parameters:
        - $ref: '#/components/parameters/EventDeltas'
      responses:
        '200':
          description: Thread-scoped SSE event stream
          headers:
            request-id: {$ref: '#/components/headers/RequestID'}
          content:
            text/event-stream:
              schema: {$ref: '#/components/schemas/EventStreamFrame'}
              x-sse-event-schemas:
                persisted: {$ref: '#/components/schemas/SessionEvent'}
                event_start: {$ref: '#/components/schemas/EventStart'}
                event_delta: {$ref: '#/components/schemas/EventDelta'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '404': {$ref: '#/components/responses/NotFound'}

  /v1/files:
    post:
      operationId: uploadFile
      tags: [Files]
      summary: Upload a File
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FileUploadRequest'
      responses:
        '200':
          $ref: '#/components/responses/FileResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '422':
          $ref: '#/components/responses/UnsupportedRequest'
    get:
      operationId: listFiles
      tags: [Files]
      summary: List Files
      parameters:
        - $ref: '#/components/parameters/FileListLimit'
        - $ref: '#/components/parameters/AfterID'
        - $ref: '#/components/parameters/BeforeID'
        - $ref: '#/components/parameters/ScopeID'
      responses:
        '200':
          $ref: '#/components/responses/FileListResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '422':
          $ref: '#/components/responses/UnsupportedRequest'
  /v1/files/{file_id}:
    parameters:
      - $ref: '#/components/parameters/FileID'
    get:
      operationId: getFileMetadata
      tags: [Files]
      summary: Get File metadata
      responses:
        '200':
          $ref: '#/components/responses/FileResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnsupportedRequest'
    delete:
      operationId: deleteFile
      tags: [Files]
      summary: Delete a File
      responses:
        '200':
          $ref: '#/components/responses/FileDeletedResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnsupportedRequest'
  /v1/files/{file_id}/content:
    parameters:
      - $ref: '#/components/parameters/FileID'
    get:
      operationId: downloadFile
      tags: [Files]
      summary: Download a File marked as downloadable
      responses:
        '200':
          $ref: '#/components/responses/FileContentResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
