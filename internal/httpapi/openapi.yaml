        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/UnsupportedRequest'}
  /v1/deployments/{deployment_id}/archive:
    parameters:
      - $ref: '#/components/parameters/DeploymentID'
    post:
      operationId: archiveDeployment
      tags: [Deployments]
      summary: Archive a Deployment
      responses:
        '200': {$ref: '#/components/responses/DeploymentResponse'}
        '404': {$ref: '#/components/responses/NotFound'}
  /v1/deployments/{deployment_id}/pause:
    parameters:
      - $ref: '#/components/parameters/DeploymentID'
    post:
      operationId: pauseDeployment
      tags: [Deployments]
      summary: Pause scheduled triggers
      responses:
        '200': {$ref: '#/components/responses/DeploymentResponse'}
        '404': {$ref: '#/components/responses/NotFound'}
  /v1/deployments/{deployment_id}/unpause:
    parameters:
      - $ref: '#/components/parameters/DeploymentID'
    post:
      operationId: unpauseDeployment
      tags: [Deployments]
      summary: Resume scheduled triggers without backfilling missed occurrences
      responses:
        '200': {$ref: '#/components/responses/DeploymentResponse'}
        '404': {$ref: '#/components/responses/NotFound'}
  /v1/deployments/{deployment_id}/run:
    parameters:
      - $ref: '#/components/parameters/DeploymentID'
    post:
      operationId: runDeployment
      tags: [Deployments]
      summary: Run a Deployment immediately
      description: >-
        Uses direct Session capability admission. An unsupported Skill capability
        returns a Run with session_creation_rejected_error and no Session ID.
        This manual failure does not pause the Deployment; the same permanent
        failure during a scheduled Run pauses further scheduled attempts.
      responses:
        '200': {$ref: '#/components/responses/DeploymentRunResponse'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /v1/deployment_runs:
    get:
      operationId: listDeploymentRuns
      tags: [Deployments]
      summary: List Deployment Runs
      parameters:
        - $ref: '#/components/parameters/DeploymentRunListLimit'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/CreatedAtGt'
        - $ref: '#/components/parameters/CreatedAtGte'
        - $ref: '#/components/parameters/CreatedAtLt'
        - $ref: '#/components/parameters/CreatedAtLte'
        - $ref: '#/components/parameters/DeploymentIDFilter'
        - $ref: '#/components/parameters/DeploymentRunHasError'
        - $ref: '#/components/parameters/DeploymentRunTriggerType'
      responses:
        '200': {$ref: '#/components/responses/DeploymentRunListResponse'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
  /v1/deployment_runs/{deployment_run_id}:
    parameters:
      - $ref: '#/components/parameters/DeploymentRunID'
    get:
      operationId: getDeploymentRun
      tags: [Deployments]
      summary: Get a Deployment Run
      responses:
        '200': {$ref: '#/components/responses/DeploymentRunResponse'}
        '404': {$ref: '#/components/responses/NotFound'}

  /healthz:
    get:
      operationId: health
      summary: Liveness probe
      security: []
      responses:
        '200':
          description: Healthy
  /readyz:
    get:
      operationId: readiness
      summary: Readiness probe
      security: []
      responses:
        '200':
          description: Ready
  /openapi.yaml:
    get:
      operationId: openAPI
      summary: Get the Mango OpenAPI document
      security: []
      responses:
        '200':
          description: OpenAPI document
          content:
            application/yaml:
              schema: {type: string}

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: >-
        Workspace API key, or the per-Work sessions_token on the limited
        self-hosted execution routes authorized for that claim.

