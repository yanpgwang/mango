        id:
          type: string
          pattern: '^[0-9]+$'
        type:
          type: string
          const: skill_version_deleted

    Metadata:
      type: object
      maxProperties: 16
      propertyNames:
        maxLength: 64
      additionalProperties:
        type: string
        maxLength: 512
    MetadataPatch:
      type: object
      propertyNames:
        maxLength: 64
      additionalProperties:
        oneOf:
          - type: string
            maxLength: 512
          - type: 'null'
