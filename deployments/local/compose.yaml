# Reproducible local development stack for the Temporal platform spine.
#
# Brings up the backing services plus separate API and worker processes:
#   - PostgreSQL   the event ledger, projections, and admission outbox (and, on a
#                  separate database, Temporal's own persistence)
#   - Temporal     durable session orchestration (auto-setup + web UI)
#   - NATS Core    ephemeral preview / SSE wakeup transport
#   - MinIO        S3-compatible File bytes for local and service conformance
#   - API          PostgreSQL-backed Mango HTTP surface
#   - Worker       Temporal worker plus PostgreSQL outbox relay
#
# Versions are pinned deliberately. Bump them intentionally, not implicitly.
#
# Start:   make local-up      (or: docker compose -f deployments/local/compose.yaml up -d)
# Health:  make local-health
# Stop:    make local-down     (add VOLUMES=1 to also drop data)
#
# See deployments/local/README.md for the full workflow and connection strings.

name: mango-local

services:
  postgres:
    image: postgres:17.5-alpine
    container_name: mango-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      # Temporal's auto-setup creates its own `temporal` / `temporal_visibility`
      # databases. This default database is the application's ledger.
      POSTGRES_DB: mango
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # pg_isready exits 0 only once the server accepts connections.
      test: ["CMD-SHELL", "pg_isready -U postgres -d mango"]
      interval: 5s
      timeout: 5s
      retries: 20

  temporal:
    image: temporalio/auto-setup:1.29.7
    container_name: mango-temporal
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12                # driver name for PostgreSQL >= 12
      DB_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PWD: postgres
      POSTGRES_SEEDS: postgres
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
    ports:
      - "7233:7233"               # gRPC frontend (SDK clients connect here)
    volumes:
      - ./dynamicconfig:/etc/temporal/config/dynamicconfig
    healthcheck:
      # tctl reaches the frontend only after namespaces are registered.
      test: ["CMD", "tctl", "--address", "temporal:7233", "cluster", "health"]
      interval: 10s
      timeout: 10s
      retries: 30

  temporal-ui:
    image: temporalio/ui:2.52.1
    container_name: mango-temporal-ui
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:8233
    ports:
      - "8233:8080"               # http://localhost:8233 for the workflow explorer

  nats:
    image: nats:2.11.17-alpine
    container_name: mango-nats
    command:
      - "--http_port=8222"        # monitoring endpoint used by the health check
    ports:
      - "4222:4222"               # client connections
      - "8222:8222"               # monitoring / /healthz
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8222/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: mango-minio
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: mango:local
    container_name: mango-api
    command: ["serve", "-addr", ":8080"]
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_healthy
      nats:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      MANGO_DATABASE_URL: postgres://postgres:postgres@postgres:5432/mango?sslmode=disable
      MANGO_API_KEY: ${MANGO_API_KEY:-sk-mango-local-development}
      MANGO_SANDBOX: docker
      MANGO_TEMPORAL_HOSTPORT: temporal:7233
      MANGO_TEMPORAL_NAMESPACE: default
      MANGO_NATS_URL: nats://nats:4222
      MANGO_FILE_S3_ENDPOINT: http://minio:9000
      MANGO_FILE_S3_REGION: us-east-1
      MANGO_FILE_S3_BUCKET: mango-files
      MANGO_FILE_S3_ACCESS_KEY: minioadmin
      MANGO_FILE_S3_SECRET_KEY: minioadmin
      MANGO_FILE_S3_PATH_STYLE: "true"
      MANGO_FILE_S3_CREATE_BUCKET: "true"
      MANGO_VAULT_KEYRING_FILE: /run/secrets/mango-vault-keyring.json
    volumes:
      - ./vault-keyring.json:/run/secrets/mango-vault-keyring.json:ro
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8080/readyz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  worker:
    image: mango:local
    # The api service builds this shared image before Compose creates either
    # application container. Never attempt to pull this intentionally local tag.
    pull_policy: never
    container_name: mango-worker
    command: ["orchestrate"]
    # This trusted process owns Docker daemon access. The API remains non-root;
    # neither this socket nor worker credentials enter Session sandboxes.
    user: "0:0"
    # Keep the execution plane alive across Docker Desktop/daemon restarts. A
    # stopped worker leaves accepted messages pending indefinitely.
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      temporal:
        condition: service_healthy
      nats:
        condition: service_healthy
    environment:
      MANGO_DATABASE_URL: postgres://postgres:postgres@postgres:5432/mango?sslmode=disable
      MANGO_TEMPORAL_HOSTPORT: temporal:7233
      MANGO_TEMPORAL_NAMESPACE: default
      MANGO_NATS_URL: nats://nats:4222
      # Model credentials are supplied by scripts/with-dev-env through Compose
      # interpolation. Empty values preserve the deterministic offline model.
      MANGO_MODEL_BASE_URL: ${MANGO_MODEL_BASE_URL:-}
      MANGO_MODEL_API_KEY: ${MANGO_MODEL_API_KEY:-}
      MANGO_MODEL_ID: ${MANGO_MODEL_ID:-}
      MANGO_MODEL_AUTH: ${MANGO_MODEL_AUTH:-x-api-key}
      MANGO_SANDBOX: docker
      MANGO_SANDBOX_IMAGE: ${MANGO_SANDBOX_IMAGE:-python:3.12-alpine}
      # Bind sources sent to the sibling-container daemon must exist at the
      # identical absolute path inside this worker and on the daemon host.
      MANGO_SANDBOX_RESOURCE_DIR: ${MANGO_SANDBOX_RESOURCE_DIR:-${HOME}/mango-resources}
      DOCKER_HOST: unix:///var/run/docker.sock
      MANGO_FILE_S3_ENDPOINT: http://minio:9000
      MANGO_FILE_S3_REGION: us-east-1
      MANGO_FILE_S3_BUCKET: mango-files
      MANGO_FILE_S3_ACCESS_KEY: minioadmin
      MANGO_FILE_S3_SECRET_KEY: minioadmin
      MANGO_FILE_S3_PATH_STYLE: "true"
      MANGO_VAULT_KEYRING_FILE: /run/secrets/mango-vault-keyring.json
    volumes:
      - ./vault-keyring.json:/run/secrets/mango-vault-keyring.json:ro
      - type: bind
        source: ${MANGO_DOCKER_SOCKET:-/var/run/docker.sock}
        target: /var/run/docker.sock
        bind:
          create_host_path: false
      - type: bind
        source: ${MANGO_SANDBOX_RESOURCE_DIR:-${HOME}/mango-resources}
        target: ${MANGO_SANDBOX_RESOURCE_DIR:-${HOME}/mango-resources}
    healthcheck:
      # There is no HTTP surface on the worker. The process being alive is the
      # minimum useful Compose signal; an exited worker cannot consume Temporal
      # tasks and must make local-health fail.
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  postgres-data:
  minio-data:
